---
# playbooks/containers_down.yml
#
# PURPOSE: Stop and remove test containers on both VMs.
#          Does not touch the VMs themselves — use nuke.yml for full teardown.
#
# USAGE:
#   ansible-playbook -i inventory/hosts.ini playbooks/containers_down.yml

- name: Stop and remove test containers
  hosts: all
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../roles/podman_setup/defaults/main.yml"

  pre_tasks:
    - name: Require incus_remote to be set explicitly
      ansible.builtin.assert:
        that:
          - incus_remote is defined
          - incus_remote | length > 0
        fail_msg: |
          'incus_remote' is not set. Pass it explicitly:
            ansible-playbook playbooks/containers_down.yml -e "incus_remote=<remote>"
            # local Incus daemon: -e "incus_remote=local"
          Available remotes: incus remote list
      run_once: true

  roles:
    - role: test_containers
      vars:
        container_state: absent
