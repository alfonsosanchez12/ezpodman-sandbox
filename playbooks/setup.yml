---
# playbooks/setup.yml
#
# PURPOSE: Install and configure all software on ezpodman-local and podman-remote.
#          Run this after provision.yml has both VMs booted and ready.
#
# USAGE:
#   ansible-playbook -i inventory/hosts.ini playbooks/setup.yml
#   ansible-playbook -i inventory/hosts.ini playbooks/setup.yml -e "incus_remote=<remote>"
#
# WHAT HAPPENS:
#   Play 1 (all VMs):
#     - Creates the sandbox user for rootless Podman
#     - Installs Podman (dnf on Fedora, apt on Debian)
#     - Configures rootless Podman (subuid/subgid, lingering)
#     - On podman-remote only: enables the podman.socket systemd user unit
#       so ezpodman-local can reach the Podman API over SSH
#
#   Play 2 (ezpodman-local only):
#     - Installs the full toolchain: git, go, jq, fzf, curl, podman-docker,
#       lazydocker, ezpodman
#
# NEXT STEP after this completes:
#   ansible-playbook -i inventory/hosts.ini playbooks/containers_up.yml

# ── Play 1: Common setup (both VMs) ──────────────────────────────────────────

- name: Common setup — Podman + rootless config
  hosts: all
  # gather_facts is deferred (false here) so we can bootstrap Python first.
  # Fedora minimal images ship without Python, which Ansible requires for all
  # modules except 'raw'. We install it with raw, then gather facts normally.
  gather_facts: false

  pre_tasks:
    - name: Require incus_remote to be set explicitly
      ansible.builtin.assert:
        that:
          - incus_remote is defined
          - incus_remote | length > 0
        fail_msg: |
          'incus_remote' is not set. Pass it explicitly:
            ansible-playbook playbooks/setup.yml -e "incus_remote=<remote>"
            # local Incus daemon: -e "incus_remote=local"
          Available remotes: incus remote list
      run_once: true   # one check is enough — no need to assert on every VM

    - name: Bootstrap Python3 (raw — works without Python on the remote)
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          echo "python3 already present"
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get install -y python3
        fi
      changed_when: false
      check_mode: false

    # Now that Python exists, gather facts as normal.
    # ansible_facts['os_family'] and ansible_facts['architecture'] are used
    # by the podman_setup role and the toolchain play below.
    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: podman_setup

# ── Play 2: ezpodman-local toolchain (Fedora only) ───────────────────────────

- name: Toolchain setup — ezpodman-local
  hosts: local
  gather_facts: true

  # sandbox_user is defined in roles/podman_setup/defaults/main.yml
  # and carries forward here so install paths are consistent.
  vars_files:
    - "{{ playbook_dir }}/../roles/podman_setup/defaults/main.yml"

  tasks:

    # ── System packages ──────────────────────────────────────────────────────

    - name: Install base toolchain packages (dnf)
      ansible.builtin.dnf:
        name:
          - git
          - golang
          - jq
          - fzf
          - curl
          # podman-docker provides a 'docker' CLI shim that redirects to Podman.
          # This lets tools that call 'docker' work without a Docker daemon.
          - podman-docker
          # podman-remote provides the 'podman-remote' CLI for managing containers
          # on remote hosts over SSH. ezpodman uses it to list and manage
          # remote connections (podman-remote system connection list/add).
          - podman-remote
        state: present

    # ── lazydocker ───────────────────────────────────────────────────────────

    # lazydocker is distributed as a pre-built binary — not in dnf.
    # We download the release tarball, extract the binary, and place it in
    # ~/.local/bin for the sandbox user (rootless, no system-wide install).
    #
    # The URL embeds the version and architecture. ansible_facts['architecture']
    # returns 'x86_64' or 'aarch64'; lazydocker releases use the same names.
    - name: Create ~/.local/bin for {{ sandbox_user }}
      ansible.builtin.file:
        path: /home/{{ sandbox_user }}/.local/bin
        state: directory
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0755"

    # lazydocker release filenames embed the version number
    # (e.g. lazydocker_0.23.3_Linux_x86_64.tar.gz), so /latest/download/ won't
    # resolve. We query the GitHub API to discover the current version tag first.
    - name: Get latest lazydocker release version from GitHub API
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
        return_content: true
      register: lazydocker_release

    - name: Set lazydocker download URL
      ansible.builtin.set_fact:
        # tag_name is e.g. "v0.23.3"; strip the leading 'v' for the filename.
        lazydocker_version: "{{ lazydocker_release.json.tag_name | regex_replace('^v', '') }}"
        lazydocker_url: >-
          https://github.com/jesseduffield/lazydocker/releases/download/{{ lazydocker_release.json.tag_name }}/lazydocker_{{ lazydocker_release.json.tag_name | regex_replace('^v', '') }}_Linux_{{ ansible_facts['architecture'] }}.tar.gz

    - name: Download and extract lazydocker {{ lazydocker_version }}
      ansible.builtin.unarchive:
        src: "{{ lazydocker_url }}"
        dest: /home/{{ sandbox_user }}/.local/bin
        include:
          - lazydocker          # only extract the binary, skip LICENSE/README
        remote_src: true        # fetch the URL on the remote VM, not the Mac
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0755"
        creates: /home/{{ sandbox_user }}/.local/bin/lazydocker  # skip if already present

    # ── ezpodman ─────────────────────────────────────────────────────────────

    # ezpodman is a single shell script fetched from GitHub.
    # Using GitHub (not the local Forgejo mirror) avoids the Step-CA TLS
    # prerequisite and works on any fresh VM without extra trust setup.
    - name: Download ezpodman from GitHub
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/alfonsosanchez12/ezpodman/main/ezpodman
        dest: /home/{{ sandbox_user }}/.local/bin/ezpodman
        mode: "0755"
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"

    # ── PATH ─────────────────────────────────────────────────────────────────

    # Ensure ~/.local/bin is on PATH for interactive shells.
    # We write to ~/.bashrc; if the user switches to zsh/fish, adjust here.
    - name: Ensure ~/.local/bin is in PATH for {{ sandbox_user }}
      ansible.builtin.lineinfile:
        path: /home/{{ sandbox_user }}/.bashrc
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0644"

    # XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS are normally set by
    # pam_systemd at login. But 'su - podman' inside an 'incus exec' session
    # does not go through PAM, so they are never populated — causing
    # 'systemctl --user' and the Podman socket to fail. Setting them explicitly
    # in .bashrc ensures they are always available regardless of how the shell
    # was started.
    - name: Set XDG_RUNTIME_DIR in .bashrc for {{ sandbox_user }}
      ansible.builtin.lineinfile:
        path: /home/{{ sandbox_user }}/.bashrc
        line: 'export XDG_RUNTIME_DIR="/run/user/$(id -u)"'
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0644"

    - name: Set DBUS_SESSION_BUS_ADDRESS in .bashrc for {{ sandbox_user }}
      ansible.builtin.lineinfile:
        path: /home/{{ sandbox_user }}/.bashrc
        line: 'export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"'
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0644"

    # DOCKER_HOST tells lazydocker (and any Docker-compatible client) where to
    # find the Podman socket. ezpodman sets this itself before launching
    # lazydocker, but setting it in .bashrc means 'lazydocker' also works when
    # invoked directly from the shell.
    - name: Set DOCKER_HOST in .bashrc for {{ sandbox_user }}
      ansible.builtin.lineinfile:
        path: /home/{{ sandbox_user }}/.bashrc
        line: 'export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"'
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0644"

    # Podman's Docker-compatible API implements Docker API v1.41. Without this,
    # lazydocker negotiates a newer version that Podman doesn't support and fails
    # with a generic exit status 1. ezpodman sets this internally; we set it here
    # so lazydocker also works when invoked directly.
    - name: Set DOCKER_API_VERSION in .bashrc for {{ sandbox_user }}
      ansible.builtin.lineinfile:
        path: /home/{{ sandbox_user }}/.bashrc
        line: 'export DOCKER_API_VERSION="1.41"'
        owner: "{{ sandbox_user }}"
        group: "{{ sandbox_user }}"
        mode: "0644"
